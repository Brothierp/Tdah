name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (types, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm test -- --ci

  backend:
    name: Backend (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Démarrer Supabase (base, auth, API, fonctions)
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,storage-api,postgres-meta,mailpit,realtime
      - name: Tests d'intégration (sécurité RLS, famille, fonctions)
        run: npm run test:backend
      - if: always()
        run: supabase stop --no-backup
